# ──────────────────────────────────────────────
# Finance AI Backend — CD: Deploy to Azure VM
# ──────────────────────────────────────────────
# Runs ONLY after the Backend CI workflow succeeds on main.
# On failure: does NOT block the CI — you get CI green and
# a failed deploy separately.
# ──────────────────────────────────────────────
name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure VM
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency: deploy-group

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Pulling latest code ==="
            cd /opt/finance-ai
            sudo -u finance-ai git pull --ff-only origin main

            echo "=== Syncing dependencies ==="
            sudo -u finance-ai uv sync --frozen --no-dev

            echo "=== Running database migrations ==="
            sudo -u finance-ai .venv/bin/alembic upgrade head

            echo "=== Restarting backend ==="
            sudo systemctl restart finance-ai-backend

            echo "=== Health check ==="
            sleep 3
            curl -fsS http://127.0.0.1:8000/health/live \
              && echo " [OK]" \
              || echo " [WARN] Health check failed — check journalctl -u finance-ai-backend"