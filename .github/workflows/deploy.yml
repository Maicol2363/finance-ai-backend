# ──────────────────────────────────────────────
# Finance AI Backend — CD: Deploy to Google Cloud Run
# ──────────────────────────────────────────────
# Runs ONLY after the Backend CI workflow succeeds on main.
# ──────────────────────────────────────────────
name: Deploy to Google Cloud Run

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: finance-ai-api
  REGION: southamerica-east1
  SERVICE_NAME: finance-api

jobs:
  deploy:
    name: Deploy to Cloud Run
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    concurrency: deploy-group

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run database migrations (Neon)
        env:
          FINANCE_AI_DATABASE_URL: ${{ secrets.FINANCE_AI_DATABASE_URL }}
        if: env.FINANCE_AI_DATABASE_URL != ''
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          uv run python -m finance_ai.db.seeds

      - name: Build runtime container
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/finance-ai/backend:${{ github.sha }}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build \
            --target runtime \
            --tag "$IMAGE" \
            .

      - name: Push container to Artifact Registry
        run: |
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE" \
            --port=8000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')

          echo "Target service URL: $URL"
          echo "Checking /health/live..."
          curl -fsS "$URL/health/live"
          echo ""

          echo "Checking protected endpoint..."
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/v1/income-sources")
          echo "Protected endpoint response: HTTP $STATUS"
          if [ "$STATUS" != "401" ]; then
            echo "Expected HTTP 401 from protected endpoint, got $STATUS"
            exit 1
          fi

          echo "Cloud Run deployment successfully verified."