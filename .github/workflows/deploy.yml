# ──────────────────────────────────────────────
# Finance AI Backend — CD: Deploy to Google Cloud Run
# ──────────────────────────────────────────────
# Releases a verified main commit to finance-api after manual dispatch.
# ──────────────────────────────────────────────
name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full main commit SHA approved for production"
        required: true
        type: string
      mfa_secret_version:
        description: "Approved numeric Secret Manager version for Staff MFA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  PROJECT_ID: finance-ai-api
  REGION: southamerica-east1
  SERVICE_NAME: finance-api
  SOURCE_SHA: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency: deploy-group
    env:
      MFA_SECRET_VERSION: ${{ inputs.mfa_secret_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify successful Backend CI for manual dispatch SHA
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ "$APPROVED_SHA" != "$SOURCE_SHA" || ! "$MFA_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Supply the approved main SHA and a numeric MFA secret version."
            exit 1
          fi
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            --method GET \
            -f event=push \
            -f branch=main \
            -f head_sha="${SOURCE_SHA}" \
            -f status=completed \
            -f per_page=100)
          if ! printf '%s' "$runs" | jq -e --arg sha "$SOURCE_SHA" \
            '.workflow_runs | any(.[]; .head_sha == $sha and .event == "push" and .conclusion == "success")' >/dev/null; then
            echo "No successful Backend CI push run found for the selected SHA. Refusing to deploy."
            exit 1
          fi

      - name: Verify production secrets are configured
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FINANCE_AI_DATABASE_URL: ${{ secrets.FINANCE_AI_DATABASE_URL }}
        run: |
          for secret in GCP_SA_KEY FINANCE_AI_DATABASE_URL; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $secret"
              exit 1
            fi
          done

      - name: Build runtime container
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/finance-ai/backend:${{ env.SOURCE_SHA }}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build \
            --target runtime \
            --tag "$IMAGE" \
            .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare Staff origin from the existing services
        run: |
          origin=$(gcloud run services describe finance-staff-web --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          [[ "$origin" =~ ^https://[a-z0-9.-]+\.run\.app$ ]]
          origins=$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -ce --arg origin "$origin" '
            [.spec.template.spec.containers[0].env[]? | select(.name == "FINANCE_AI_CORS_ALLOWED_ORIGINS")] as $matches
            | if ($matches | length) == 0 then []
              else ($matches[0].value // error("Existing allowlist has no literal value") | fromjson)
              end
            | if type == "array" and all(.[]; type == "string") then .
              else error("Invalid existing CORS allowlist")
              end
            | if index($origin) == null then . + [$origin] else . end
          ')
          [[ "$origins" != *'|'* ]]
          echo "STAFF_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "CORS_ALLOWED_ORIGINS=$origins" >> "$GITHUB_ENV"

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Push container to Artifact Registry
        run: |
          docker push "$IMAGE"

      - name: Verify the release SHA is still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo "::error::This run targets an older commit. Deploy the current main commit after CI passes."
            exit 1
          fi

      - name: Apply Neon migrations and reference seeds
        env:
          FINANCE_AI_DATABASE_URL: ${{ secrets.FINANCE_AI_DATABASE_URL }}
        run: |
          docker run --rm --env FINANCE_AI_DATABASE_URL "$IMAGE" alembic upgrade head
          docker run --rm --env FINANCE_AI_DATABASE_URL "$IMAGE" python -m finance_ai.db.seeds

      - name: Deploy to Cloud Run
        run: |
          # Update the existing service without respecifying its runtime or scaling settings.
          gcloud run services update "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --update-env-vars "^|^FINANCE_AI_CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS" \
            --update-secrets "FINANCE_AI_STAFF_MFA_ENCRYPTION_KEY=finance-ai-staff-mfa-encryption-key:$MFA_SECRET_VERSION" \
            --quiet

      - name: Verify deployment health
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')

          echo "Target service URL: $URL"
          echo "Checking /health/ready..."
          curl --fail --silent --show-error --max-time 15 "$URL/health/ready"
          echo ""

          echo "Checking protected endpoint..."
          STATUS=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$URL/api/v1/income-sources")
          echo "Protected endpoint response: HTTP $STATUS"
          if [ "$STATUS" != "401" ]; then
            echo "Expected HTTP 401 from protected endpoint, got $STATUS"
            exit 1
          fi

          # The refresh without a cookie reaches auth only after the origin and HTTPS checks.
          response=$(mktemp)
          status=$(curl --silent --show-error --max-time 15 --output "$response" --write-out '%{http_code}' \
            -H "Origin: $STAFF_ORIGIN" -H 'X-Staff-Request: 1' -H 'Content-Type: application/json' \
            --data '{}' "$URL/api/v1/staff/auth/refresh")
          test "$status" = 401
          jq -e '.code == "session_invalid"' "$response" >/dev/null

          echo "Cloud Run deployment successfully verified."
