name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: finance_ai_test
          POSTGRES_USER: finance_ai
          POSTGRES_PASSWORD: change-me-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ai -d finance_ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FINANCE_AI_ENVIRONMENT: test
      FINANCE_AI_DATABASE_URL: postgresql+psycopg://finance_ai:change-me-ci@127.0.0.1:5432/finance_ai_test
      FINANCE_AI_TEST_DATABASE_URL: postgresql+psycopg://finance_ai:change-me-ci@127.0.0.1:5432/finance_ai_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Resolve locked dependencies
        run: uv sync --all-groups --frozen
      - name: Format, lint, and type-check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
      - name: Verify migrations, seed, and model drift
        run: |
          uv run alembic upgrade head
          uv run python -m finance_ai.db.seeds
          uv run alembic check
      - name: Verify generated OpenAPI
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json
      - name: Run tests with coverage
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Build source and wheel distributions
        run: uv build
      - name: Audit locked dependencies
        run: uv run pip-audit
      - name: Publish coverage to SonarQube Cloud
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '')
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
