# Isolated fictional Security Auditor data. Always use the project name finance-audit-demo.
# Set AUDIT_DEMO_DB_PASSWORD to a random local value first; no password is stored here.
services:
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: audit_demo_test
      POSTGRES_USER: audit_demo
      POSTGRES_PASSWORD: ${AUDIT_DEMO_DB_PASSWORD:?Set AUDIT_DEMO_DB_PASSWORD to a random local value}
    volumes:
      - audit-demo-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U audit_demo -d audit_demo_test]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]
  api:
    build:
      context: .
      target: runtime
    environment:
      FINANCE_AI_ENVIRONMENT: local
      FINANCE_AI_DATABASE_URL: postgresql+psycopg://audit_demo:${AUDIT_DEMO_DB_PASSWORD:?Set AUDIT_DEMO_DB_PASSWORD to a random local value}@database:5432/audit_demo_test
      FINANCE_AI_CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:4173"]'
      FINANCE_AI_STAFF_LOCAL_COOKIE_EXCEPTION_ENABLED: 'true'
    volumes:
      - ./scripts/seed_audit_demo.py:/app/scripts/seed_audit_demo.py:ro
      - audit-demo-credentials:/app/demo-data
    # The TOTP encryption key is generated once inside the demo volume; it is never committed.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        mkdir -p demo-data &&
        if [ ! -s demo-data/mfa.key ]; then
        python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())" > demo-data/mfa.key;
        fi &&
        export FINANCE_AI_STAFF_MFA_ENCRYPTION_KEY="$$(cat demo-data/mfa.key)" &&
        alembic upgrade head &&
        python -m finance_ai.db.seeds &&
        python scripts/seed_audit_demo.py &&
        exec uvicorn finance_ai.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8002:8000"]
    depends_on:
      database:
        condition: service_healthy
    networks: [private, client-access]
networks:
  private:
    internal: true
  client-access: {}
volumes:
  audit-demo-data: {}
  audit-demo-credentials: {}
