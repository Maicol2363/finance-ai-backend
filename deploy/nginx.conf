# ──────────────────────────────────────────────
# Finance AI Backend — Nginx reverse proxy
# ──────────────────────────────────────────────
# Place in /etc/nginx/sites-available/finance-ai
# sudo ln -sf /etc/nginx/sites-available/finance-ai /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (replace your-domain.com):
#   sudo certbot --nginx -d your-domain.com
# ──────────────────────────────────────────────

upstream finance-ai-backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL — fill after certbot ──
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Receipt images (up to 10 MB)
    client_max_body_size 10M;

    # ── API reverse proxy ──
    location / {
        proxy_pass http://finance-ai-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Receipt images (local disk) ──
    location /receipts/ {
        alias /opt/finance-ai/receipts/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health endpoint ──
    location /health/ {
        proxy_pass http://finance-ai-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    access_log /var/log/nginx/finance-ai-access.log;
    error_log  /var/log/nginx/finance-ai-error.log;
}