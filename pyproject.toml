[project]
name = "finance-ai-backend"
version = "0.1.0"
description = "Manual-first Finance AI API"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
  "fastapi>=0.140,<0.141",
  "limits>=5,<6",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0.45,<2.1",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "hypothesis>=6.165,<7",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/finance_ai/resources" = "finance_ai/resources"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["finance_ai"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
